<script>
  // Fix for Vercel separate uploads — support both VITE_ and NEXT_PUBLIC_ keys
  window.SUPABASE_URL = window.SUPABASE_URL || window.NEXT_PUBLIC_SUPABASE_URL || window.__NEXT_PUBLIC_SUPABASE_URL || localStorage.getItem('sb-url') || localStorage.getItem('NEXT_PUBLIC_SUPABASE_URL') || localStorage.getItem('VITE_SUPABASE_URL') || "";
  window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || window.NEXT_PUBLIC_SUPABASE_ANON_KEY || window.__NEXT_PUBLIC_SUPABASE_ANON_KEY || localStorage.getItem('sb-anon') || localStorage.getItem('NEXT_PUBLIC_SUPABASE_ANON_KEY') || localStorage.getItem('VITE_SUPABASE_ANON_KEY') || "";
  // If Vercel injected NEXT_PUBLIC into window (for Next.js projects), use it
  if(!window.SUPABASE_URL && typeof NEXT_PUBLIC_SUPABASE_URL !== 'undefined') window.SUPABASE_URL = NEXT_PUBLIC_SUPABASE_URL;
  if(!window.SUPABASE_ANON_KEY && typeof NEXT_PUBLIC_SUPABASE_ANON_KEY !== 'undefined') window.SUPABASE_ANON_KEY = NEXT_PUBLIC_SUPABASE_ANON_KEY;
</script>

</head>
<body>

<div id="sb-keys-overlay" style="position:fixed;top:0;left:0;right:0;z-index:999999;background:#0f172a;color:white;padding:12px 12px 10px;font-family:system-ui;display:none;border-bottom:2px solid #22c55e;">
  <div style="max-width:900px;margin:0 auto;">
    <div style="font-weight:800;font-size:13px;letter-spacing:.08em;margin-bottom:8px;">🌍 Global Wall Offline — Paste your Supabase keys to go LIVE</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <input id="inp-url" placeholder="https://xxxx.supabase.co  (from NEXT_PUBLIC_SUPABASE_URL eye)" style="flex:1;min-width:220px;background:#1e293b;border:1px solid #334155;color:white;padding:8px 10px;border-radius:8px;font-size:13px;">
      <input id="inp-anon" placeholder="eyJhbG... anon key (from NEXT_PUBLIC_SUPABASE_ANON_KEY eye)" style="flex:1;min-width:220px;background:#1e293b;border:1px solid #334155;color:white;padding:8px 10px;border-radius:8px;font-size:13px;">
      <button id="btn-save-keys" style="background:#22c55e;color:#052e16;font-weight:800;padding:8px 16px;border-radius:8px;border:0;font-size:13px;cursor:pointer;">Save & Go LIVE</button>
      <button id="btn-clear-keys" style="background:#334155;color:white;padding:8px 12px;border-radius:8px;border:0;font-size:12px;">Clear</button>
    </div>
    <div style="font-size:11px;opacity:.7;margin-top:6px;">Saved in this browser only (localStorage sb-url / sb-anon). Also works if you add VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY in Vercel → Settings → Env Vars as Config.</div>
  </div>
</div>
<script>
(function(){
  function get(k){ try{ return localStorage.getItem(k) }catch(e){ return "" } }
  function hasKeys(){
    var u = window.SUPABASE_URL || window.NEXT_PUBLIC_SUPABASE_URL || get('sb-url') || get('NEXT_PUBLIC_SUPABASE_URL') || get('VITE_SUPABASE_URL');
    var a = window.SUPABASE_ANON_KEY || window.NEXT_PUBLIC_SUPABASE_ANON_KEY || get('sb-anon') || get('NEXT_PUBLIC_SUPABASE_ANON_KEY') || get('VITE_SUPABASE_ANON_KEY');
    return !!(u && a && u.startsWith('https://') && a.startsWith('eyJ'));
  }
  function showIfNeeded(){
    var overlay = document.getElementById('sb-keys-overlay');
    if(!overlay) return;
    if(!hasKeys()){
      overlay.style.display='block';
      document.body.style.paddingTop = overlay.offsetHeight+'px';
    } else {
      overlay.style.display='none';
      document.body.style.paddingTop='0px';
    }
  }
  document.addEventListener('DOMContentLoaded', function(){
    showIfNeeded();
    var btn=document.getElementById('btn-save-keys');
    var btnClear=document.getElementById('btn-clear-keys');
    if(btn) btn.addEventListener('click', function(){
      var u=document.getElementById('inp-url').value.trim();
      var a=document.getElementById('inp-anon').value.trim();
      if(!u || !a){ alert('Paste both URL and anon key'); return; }
      try{
        localStorage.setItem('sb-url', u);
        localStorage.setItem('sb-anon', a);
        localStorage.setItem('NEXT_PUBLIC_SUPABASE_URL', u);
        localStorage.setItem('NEXT_PUBLIC_SUPABASE_ANON_KEY', a);
        localStorage.setItem('VITE_SUPABASE_URL', u);
        localStorage.setItem('VITE_SUPABASE_ANON_KEY', a);
        window.SUPABASE_URL = u;
        window.SUPABASE_ANON_KEY = a;
        location.reload();
      }catch(e){ alert('Save failed: '+e.message); }
    });
    if(btnClear) btnClear.addEventListener('click', function(){
      try{
        ['sb-url','sb-anon','NEXT_PUBLIC_SUPABASE_URL','NEXT_PUBLIC_SUPABASE_ANON_KEY','VITE_SUPABASE_URL','VITE_SUPABASE_ANON_KEY'].forEach(function(k){ localStorage.removeItem(k); });
        location.reload();
      }catch(e){}
    });
  });
  // also try immediately before DOMContentLoaded for fast injection
  setTimeout(showIfNeeded, 300);
  setTimeout(showIfNeeded, 1000);
})();
</script>
